{% extends "base.html" %}{% block content %}<div class="top"><div><h1>الغرف</h1><div class="muted">إضافة الغرف وربطها بالفنادق.</div></div></div><div class="panel"><form method="post" class="form"><label>الفندق<select name="hotel_id">{% for h in hotels %}<option value="{{h.id}}">{{h.name}}</option>{% endfor %}</select></label><label>رقم الغرفة<input name="number" required></label><label>نوع الغرفة<input name="room_type" value="مزدوجة"></label><label>السعر لليلة<input type="number" name="price" value="350" step="0.01"></label><label>الحالة<select name="status"><option value="available">متاحة</option><option value="maintenance">صيانة</option></select></label><div><button class="btn primary">إضافة غرفة</button></div></form></div><div class="panel"><table><tr><th>الفندق</th><th>الغرفة</th><th>النوع</th><th>السعر</th><th>الحالة</th></tr>{% for r in rooms %}<tr><td>{{r.hotel}}</td><td>{{r.number}}</td><td>{{r.room_type}}</td><td>{{"{:,.2f}".format(r.price)}} ر.س</td><td>{{r.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
