{% extends "base.html" %}{% block content %}<div class="top"><div><h1>الإجازات والمواسم</h1><div class="muted">حدد فترات الإجازات والمواسم.</div></div></div><div class="panel"><form method="post" class="form"><label>اسم الموسم<input name="name" required></label><label>ملاحظات<input name="notes"></label><label>من<input type="date" name="start_date" required></label><label>إلى<input type="date" name="end_date" required></label><div><button class="btn primary">إضافة الموسم</button></div></form></div><div class="panel"><table><tr><th>الموسم</th><th>من</th><th>إلى</th><th>ملاحظات</th></tr>{% for s in seasons %}<tr><td>{{s.name}}</td><td>{{s.start_date}}</td><td>{{s.end_date}}</td><td>{{s.notes}}</td></tr>{% endfor %}</table></div>{% endblock %}
