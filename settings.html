```html
{% extends "base.html" %}

{% block content %}
<div class="pagehead">
    <div>
        <h1>⚙️ إعدادات النظام</h1>
        <p class="muted">بيانات شركة FORTANCE HOTELS والفواتير والدفع</p>
    </div>
</div>

<form method="post" action="/settings" class="panel">
    <div class="formgrid">

        <div class="field">
            <label>اسم الشركة</label>
            <input type="text" name="company_name"
                   value="{{ settings.get('company_name', 'FORTANCE HOTELS') }}"
                   required>
        </div>

        <div class="field">
            <label>رقم الهاتف</label>
            <input type="text" name="company_phone"
                   value="{{ settings.get('company_phone', '') }}">
        </div>

        <div class="field">
            <label>البريد الإلكتروني</label>
            <input type="email" name="company_email"
                   value="{{ settings.get('company_email', '') }}">
        </div>

        <div class="field">
            <label>العملة</label>
            <select name="currency">
                <option value="ريال سعودي"
                    {% if settings.get('currency') == 'ريال سعودي' %}selected{% endif %}>
                    ريال سعودي
                </option>
                <option value="دولار أمريكي"
                    {% if settings.get('currency') == 'دولار أمريكي' %}selected{% endif %}>
                    دولار أمريكي
                </option>
            </select>
        </div>

        <div class="field" style="grid-column:1/-1">
            <label>عنوان الشركة</label>
            <input type="text" name="company_address"
                   value="{{ settings.get('company_address', '') }}">
        </div>

        <div class="field">
            <label>مزود الدفع</label>
            <select name="payment_provider">
                <option value="">اختر مزود الدفع</option>
                <option value="paytabs"
                    {% if settings.get('payment_provider') == 'paytabs' %}selected{% endif %}>
                    PayTabs
                </option>
                <option value=" Moyasar"
                    {% if settings.get('payment_provider') == ' Moyasar' %}selected{% endif %}>
                    Moyasar
                </option>
                <option value="other"
                    {% if settings.get('payment_provider') == 'other' %}selected{% endif %}>
                    مزود آخر
                </option>
            </select>
        </div>

        <div class="field" style="grid-column:1/-1">
            <label>رابط الدفع الإلكتروني</label>
            <input type="url" name="payment_url"
                   placeholder="https://..."
                   value="{{ settings.get('payment_url', '') }}">
            <small class="muted">
                ضع رابط الدفع الذي حصلت عليه من مزود الخدمة.
                حفظ الرابط وحده لا ينفذ عملية تحصيل.
            </small>
        </div>

    </div>

    <p>
        <button type="submit" class="gold">💾 حفظ الإعدادات</button>
    </p>
</form>
{% endblock %}
```
