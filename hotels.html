{% extends "base.html" %}{% block content %}<div class="top"><div><h1>الفنادق</h1><div class="muted">أضف وأدر الفنادق التي تتوفر فيها الغرف.</div></div></div><div class="panel"><h2>إضافة فندق</h2><form method="post" class="form"><label>اسم الفندق<input name="name" required></label><label>المدينة<input name="city"></label><label>الهاتف<input name="phone"></label><label>ملاحظات<input name="notes"></label><div><button class="btn primary">حفظ الفندق</button></div></form></div><div class="panel"><table><tr><th>الفندق</th><th>المدينة</th><th>الهاتف</th><th>الغرف</th></tr>{% for h in hotels %}<tr><td>{{h.name}}</td><td>{{h.city}}</td><td>{{h.phone}}</td><td>{{h.rooms}}</td></tr>{% endfor %}</table></div>{% endblock %}
