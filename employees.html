{% extends "base.html" %}{% block content %}<div class="top"><div><h1>الموظفون والصلاحيات</h1><div class="muted">أضف موظفين، ولكل موظف دور وصلاحيات أساسية.</div></div></div><div class="panel"><h2>إضافة موظف</h2><form method="post" class="form"><label>اسم الموظف<input name="name" required></label><label>اسم المستخدم<input name="username" required></label><label>كلمة المرور<input type="password" name="password" required></label><label>الصلاحية<select name="role">{% for k,v in ROLES.items() %}<option value="{{k}}">{{v}}</option>{% endfor %}</select></label><div><button class="btn primary">إضافة الموظف</button></div></form></div><div class="panel"><h2>قائمة الموظفين</h2><table><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr>{% for e in employees %}<tr><td>{{e.name}}</td><td>{{e.username}}</td><td>{{ROLES[e.role]}}</td><td>{{'نشط' if e.active else 'موقوف'}}</td><td><form method="post" action="/employees/toggle/{{e.id}}"><button class="btn {{'danger' if e.active else 'gold'}}">{{'إيقاف' if e.active else 'تفعيل'}}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
